services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spotify}
      POSTGRES_USER: ${POSTGRES_USER:-spotify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spotify}
    ports:
      - "127.0.0.1:5433:5432" # so acessivel da propria maquina (usado pelo load_data.py)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/setup_db.sql:/docker-entrypoint-initdb.d/01_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spotify}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spotify}:${POSTGRES_PASSWORD:-spotify}@db:5432/${POSTGRES_DB:-spotify}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/rate-limit.conf:/etc/nginx/conf.d/00-rate-limit.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
